<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NHL Sim">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rinkside Sim – every scheduled NHL game, simulated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --raised:#e9edf2; --line:#dde2e9;
  --text:#18202b; --muted:#667180; --good:#1f9d63; --bad:#d4483b; --mid:#c98a12;
  --hot:#0f8f86; --teamA:#3a6fd8; --teamB:#c98a12;
  --num:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171e; --surface:#1a2129; --raised:#232c37; --line:#2b3542;
    --text:#ebeff4; --muted:#8e99a8; --good:#3cc786; --bad:#f06a5d; --mid:#e6a93a; --hot:#2fc4b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171e; --surface:#1a2129; --raised:#232c37; --line:#2b3542;
  --text:#ebeff4; --muted:#8e99a8; --good:#3cc786; --bad:#f06a5d; --mid:#e6a93a; --hot:#2fc4b8;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 0 40px}
.n{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .midc{color:var(--mid)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font:700 22px/1.1 var(--body);letter-spacing:-.01em}
.brand .btns{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.datebar{display:flex;align-items:center;gap:6px;padding:0 14px}
.datebar button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:18px}
.datebar .d{flex:1;text-align:center;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 0}
.quick{display:flex;gap:6px;padding:8px 14px 0}
.quick button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.quick button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 14px 8px}
.settings label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.settings label:first-child{margin-top:0}
.seg{display:flex;background:var(--raised);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}

.section{padding:12px 14px 0}
.section h2{font-size:14px;font-weight:600;color:var(--muted);margin:4px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.games{display:grid;gap:8px}
.game{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.game:hover{border-color:var(--muted)}
.game .gr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.game .tm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.game .tm:last-child{justify-content:flex-end}
.game .tm small{font-weight:400;color:var(--muted);font-size:12px}
.game img{width:30px;height:30px;flex:none}
.game .mid{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.game .res{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.game .res .n{font-size:18px}
.game .res .tap{color:var(--muted)}
.go{border:0;background:var(--text);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.go:disabled{opacity:.5;cursor:default}

.hero{margin:4px 14px 0;border-radius:18px;padding:40px 16px 14px;color:#fff;background:linear-gradient(110deg,var(--teamA) 0%,color-mix(in srgb,var(--teamA) 70%,#000) 49%,color-mix(in srgb,var(--teamB) 70%,#000) 51%,var(--teamB) 100%);position:relative}
.hero .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.hero .side{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.hero .side img{width:56px;height:56px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.hero .side small{font-weight:500;font-size:12px;opacity:.9}
.hero .at{font:700 24px/1 var(--num);opacity:.9}
.hero .odds{text-align:center;font-size:13px;margin-top:10px;opacity:.95;font-weight:500}
.back{position:absolute;top:10px;left:10px;border:0;background:rgba(0,0,0,.28);color:#fff;border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.rerun{position:absolute;top:10px;right:10px;border:0;background:rgba(0,0,0,.28);color:#fff;border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:12px 14px 0;overflow:hidden}
.card > h3{margin:0;padding:12px 14px;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card > h3 small{font-weight:400;color:var(--muted);font-size:12.5px}

.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 14px 4px;gap:8px}
.score .s{display:flex;align-items:center;gap:10px}
.score .s:last-child{justify-content:flex-end}
.score .s img{width:38px;height:38px}
.score .s .n{font-size:46px;line-height:1}
.score .dash{color:var(--muted);font:600 26px/1 var(--num)}
.score .win{color:var(--good)}
.wp{padding:6px 14px 12px}
.wp .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.wp .track{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:5px;background:var(--raised)}
.wp .track i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:2px 14px 12px;font-size:13.5px;align-items:baseline}
.kv .n{font-size:18px;text-align:right}
.kv .sub{grid-column:1/-1;font-size:12px;color:var(--muted);margin:-2px 0 6px}
.actual{margin:0 14px 12px;background:var(--raised);border-radius:10px;padding:8px 10px;font-size:13px}

.hist{padding:8px 10px 4px}
.hist svg{width:100%;height:auto;display:block}
.hist .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px 8px}

.fac{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.fac:first-of-type{border-top:0}
.fac .t{font-weight:600;font-size:14px}
.fac .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.fac .v{text-align:right;line-height:1.05}
.fac .v .n{font-size:20px;display:block}
.fac .v span{font-size:11.5px;color:var(--muted)}
.fac.total{background:var(--raised)}

.inj-row{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;padding:9px 14px;border-top:1px solid var(--line);align-items:center;font-size:13.5px}
.inj-row:first-of-type{border-top:0}
.inj-row .sub{font-size:12px;color:var(--muted)}
.inj-row .n{font-size:17px;text-align:right}
.pill{font-size:11.5px;font-weight:700;border-radius:12px;padding:2px 8px;white-space:nowrap}
.pill.out{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.pill.q{background:color-mix(in srgb,var(--mid) 18%,var(--surface));color:var(--mid)}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}

.tabs{display:flex;gap:4px;padding:10px 14px 0}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button img{width:20px;height:20px}
.tabs button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.plist{padding-top:8px}
.plist .pr{display:grid;grid-template-columns:1fr 34px 36px 34px 34px 34px;gap:4px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.plist .pr.hd{cursor:default;color:var(--muted);font-size:12px;padding-top:4px;padding-bottom:6px;border-top:0}
.plist .pr .n{text-align:right;font-size:17px}
.plist .pr.hd span:not(:first-child){text-align:right}
.plist .pr .who{min-width:0;display:flex;align-items:center;gap:8px}
.plist .pr .who img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;background:var(--raised);flex:none}
.plist .pr .who span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;line-height:1.2}
.plist .pr .who small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.plist .pr.dim{opacity:.55}
.detail{background:var(--raised);padding:10px 14px 12px;border-top:1px solid var(--line)}
.detail table{background:var(--surface);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 6px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--muted);font-weight:500;font-size:12px}
td.n{font-size:16px}
.why{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.why b{color:var(--text);font-weight:600}

.empty{padding:26px 22px;text-align:center;color:var(--muted)}
.err{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:14px;padding:12px 14px;margin:12px 14px;font-size:14px}
.loading{padding:36px 22px;text-align:center;color:var(--muted)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--hot);animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.bar{height:6px;background:var(--raised);border-radius:4px;overflow:hidden;max-width:260px;margin:10px auto 0}
.bar i{display:block;height:100%;background:var(--hot);transition:width .2s}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;padding:0 18px}

.plist .pr{grid-template-columns:1fr 36px 36px 38px 34px 38px}
.gl-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;font-size:13.5px}
.gl-row:first-of-type{border-top:0}
.gl-row .who{display:flex;align-items:center;gap:8px;min-width:0}
.gl-row .who img{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:top;background:var(--raised);flex:none}
.gl-row .sub{font-size:12px;color:var(--muted)}
.gl-row .st{text-align:right;line-height:1.1}
.gl-row .st .n{font-size:20px;display:block}
.gl-row .st span{font-size:11.5px;color:var(--muted)}
.gl-row .line{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-left:40px}
.gl-row .line b{color:var(--text);font-family:var(--num);font-weight:600;font-size:15px}
.gl-row.dim{opacity:.55}
.probs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.probs span{background:var(--surface);border-radius:9px;padding:5px 9px;font-size:12.5px;color:var(--muted)}
.probs b{color:var(--text);font-family:var(--num);font-size:15px;font-weight:600}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Rinkside Sim</h1>
      <div class="btns"><button class="iconbtn" id="setbtn" aria-expanded="false">Settings</button></div>
    </div>
  </div>
  <div id="settings" hidden></div>
  <div id="app"></div>
  <p class="note">Simulations use ESPN box scores, goalie stats, injury reports and schedules, plus Vegas lines. Results are probabilities, not guarantees.</p>
</div>

<script>
/* ================= constants ================= */
// id, abbr, name, time zone (hours from Eastern)
const TEAMS = [
 [25,"ANA","Ducks",-3],[1,"BOS","Bruins",0],[2,"BUF","Sabres",0],[3,"CGY","Flames",-2],[7,"CAR","Hurricanes",0],
 [4,"CHI","Blackhawks",-1],[17,"COL","Avalanche",-2],[29,"CBJ","Blue Jackets",0],[9,"DAL","Stars",-1],[5,"DET","Red Wings",0],
 [6,"EDM","Oilers",-2],[26,"FLA","Panthers",0],[8,"LA","Kings",-3],[30,"MIN","Wild",-1],[10,"MTL","Canadiens",0],
 [27,"NSH","Predators",-1],[11,"NJ","Devils",0],[12,"NYI","Islanders",0],[13,"NYR","Rangers",0],[14,"OTT","Senators",0],
 [15,"PHI","Flyers",0],[16,"PIT","Penguins",0],[18,"SJ","Sharks",-3],[124292,"SEA","Kraken",-3],[19,"STL","Blues",-1],
 [20,"TB","Lightning",0],[21,"TOR","Maple Leafs",0],[129764,"UTAH","Mammoth",-2],[22,"VAN","Canucks",-3],[37,"VGK","Golden Knights",-3],
 [23,"WSH","Capitals",0],[28,"WPG","Jets",-1]
].map(([id,abbr,name,tz])=>({id:String(id),abbr,name,tz,logo:`https://a.espncdn.com/i/teamlogos/nhl/500/${abbr.toLowerCase()}.png`}));
const teamById = id => TEAMS.find(t=>t.id===String(id));
const tzOf = id => teamById(id)?.tz ?? 0;
const S = "https://site.api.espn.com/apis";
const SW = "https://site.web.api.espn.com/apis";

const HIA = 0.16;       // league home-ice edge, goals
const EN_SUB = 0.08;    // empty-net goals per team-game, simulated separately in the last minutes
const SV_K = 1000;      // shots of league-average goaltending mixed into every goalie's save rate
// skater row: [id,pos,toi,g,a,sog]   goalie row: [id,toi,sa,ga,started]
const K = {id:0,pos:1,toi:2,g:3,a:4,sog:5};
const GK = {id:0,toi:1,sa:2,ga:3,st:4};
const PRI = {F:{sog60:7.0, sh:0.11, a60:1.25, repl:0.18}, D:{sog60:4.6, sh:0.05, a60:0.9, repl:0.10}};

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const f1 = x => isFinite(x) ? x.toFixed(1) : "–";
const f2 = x => isFinite(x) ? x.toFixed(2) : "–";
const sgn = (x,d=2) => (x>0?"+":x<0?"−":"") + Math.abs(x).toFixed(d);
const pct = x => isFinite(x) ? Math.round(x*100)+"%" : "–";
const svp = x => isFinite(x) ? x.toFixed(3).replace(/^0/,"") : "–";
const head = id => `https://a.espncdn.com/i/headshots/nhl/players/full/${id}.png`;
const lastName = n => String(n||"").split(" ").slice(-1)[0];
const seasonYear = () => { const d=new Date(); return d.getMonth()>=8 ? d.getFullYear()+1 : d.getFullYear(); };
function posGroup(pos){ pos=String(pos||"").toUpperCase(); if(pos==="G") return "G"; if(pos==="D"||pos.startsWith("D")) return "D"; return "F"; }
const POS_NAME = {F:"forwards", D:"defensemen"};
const tick = () => new Promise(r=>setTimeout(r,30));
const cleanColor = c => c && /^[0-9a-f]{6}$/i.test(c) && !/^(000000|ffffff)$/i.test(c) ? "#"+c : null;
function toi(v){
  const s = String(v ?? "").trim(); const m = s.match(/^(\d+):(\d{1,2})$/);
  if(m) return +m[1] + +m[2]/60;
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
const r1 = x => Math.round(x*10)/10;

// dates are handled as US Eastern calendar days, like the NHL schedule
const etYMD = d => new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(d).replace(/-/g,"");
const ymdUTC = y => Date.UTC(+y.slice(0,4), +y.slice(4,6)-1, +y.slice(6,8));
const shiftDay = (y,n) => new Date(ymdUTC(y)+n*864e5).toISOString().slice(0,10).replace(/-/g,"");
const etDayNum = ms => Math.round(ymdUTC(etYMD(new Date(ms)))/864e5);
function dayLabel(y){
  const today = etYMD(new Date());
  const s = new Date(ymdUTC(y)+12*3600e3).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
  return y===today ? `Today · ${s}` : y===shiftDay(today,1) ? `Tomorrow · ${s}` : y===shiftDay(today,-1) ? `Yesterday · ${s}` : s;
}

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const settings = Object.assign({sims:10000, win:20, vegas:0.25}, LS.get("rsim_settings", {}));
const saveSettings = () => LS.set("rsim_settings", settings);
const teamWin = () => settings.win || 999;
const playerWin = () => settings.win ? Math.max(settings.win, 20) : 999;

async function getJSON(url){
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    const r = await fetch("https://corsproxy.io/?url="+encodeURIComponent(url));
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }
}
const soft = p => p.catch(()=>null);
async function runPool(items, n, fn){
  let i = 0;
  await Promise.all(Array.from({length:Math.min(n,items.length)}, async()=>{
    while(i<items.length){ const it = items[i++]; try{ await fn(it); }catch(e){} }
  }));
}

/* ================= random ================= */
function gauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function gamma(k){ // Marsaglia–Tsang, k >= 1, mean k
  const d=k-1/3, c=1/Math.sqrt(9*d);
  for(;;){ let x, v; do{ x=gauss(); v=1+c*x; }while(v<=0); v=v*v*v; const u=Math.random();
    if(u<1-0.0331*x*x*x*x || Math.log(u)<0.5*x*x+d*(1-v+Math.log(v))) return d*v; }
}
function poisson(l){
  if(l<=0) return 0;
  if(l>30) return Math.max(0, Math.round(l+Math.sqrt(l)*gauss()));
  const L=Math.exp(-l); let k=0, p=1; do{ k++; p*=Math.random(); }while(p>L); return k-1;
}
const negbin = (m, k) => m<=0 ? 0 : poisson(m*gamma(k)/k);
function pickW(list, wf, skip){
  let t = 0; for(const x of list) if(x!==skip) t += wf(x);
  if(t<=0) return null;
  let r = Math.random()*t;

function playProb(st){
  const s = String(st||"").toLowerCase();
  if(!s) return 1;
  if(/out|suspend|inactive|injured reserve|\bltir\b|\bir\b/.test(s)) return 0;
  if(/doubt/.test(s)) return 0.2;
  if(/question|game.?time/.test(s)) return 0.5;

}

// goalie season lines: {cur:{gp,sa,ga}, prev:{gp,sa,ga}}
const GSTAT = {};
function parseGoalieStats(j){
  const years = {};
  for(const c of (j?.categories||[])){
    const cat = String(c.name||c.displayName||"").toLowerCase();
    if(/post|playoff|career/.test(cat)) continue;
    const N = c.names||[], L = c.labels||[];
    const ix = (...ks) => { for(const k of ks){ let i = N.indexOf(k); if(i<0) i = L.indexOf(k); if(i>=0) return i; } return -1; };
    const iGP=ix("gamesPlayed","GP"), iSA=ix("shotsAgainst","SA"), iGA=ix("goalsAgainst","GA"), iSV=ix("saves","SV");
    for(const r of (c.statistics||[])){
      const y = +r.season?.year; if(!y || !Array.isArray(r.stats)) continue;
      const v = i => i>=0 ? parseFloat(String(r.stats[i]).replace(/,/g,"")) : NaN;
      let sa = v(iSA), ga = v(iGA); const sv = v(iSV), gp = v(iGP);
      if(!isFinite(sa) && isFinite(sv) && isFinite(ga)) sa = sv+ga;
      if(!isFinite(ga) && isFinite(sv) && isFinite(sa)) ga = sa-sv;
      const o = years[y] || (years[y] = {gp:NaN, sa:NaN, ga:NaN});
      if(isFinite(gp) && !(o.gp>=gp)) o.gp = gp;
      if(isFinite(sa) && !(o.sa>=sa)){ o.sa = sa; if(isFinite(ga)) o.ga = ga; }
    }
  }
  const Y = seasonYear(), ok = o => o && o.sa>0 && isFinite(o.ga);
  return {cur: ok(years[Y]) ? years[Y] : null, prev: ok(years[Y-1]) ? years[Y-1] : null};
}
async function goalieStats(id){

const BOX_KEY = "rsim_box_"+seasonYear();

function saveBox(){

function teamPP(j, teamId){
  const t = (j?.boxscore?.teams||[]).find(x=>String(x.team?.id)===String(teamId));
  let ppg = NaN, ppo = NaN;
  for(const s of (t?.statistics||[])){
    const nm = String(s.name||s.abbreviation||s.label||"").toLowerCase(), dv = String(s.displayValue ?? s.value ?? "");
    const pair = dv.match(/^(\d+)\s*[\/-]\s*(\d+)$/);
    if(/powerplaygoals|^ppg$/.test(nm)) ppg = parseFloat(dv);
    else if(/powerplayopportunities|^ppo$/.test(nm)) ppo = parseFloat(dv);
    else if(/^powerplay$|^pp$/.test(nm) && pair){ ppg = +pair[1]; ppo = +pair[2]; }
  }
  return isFinite(ppg) && isFinite(ppo) ? [ppg, ppo] : null;
}
function parseBox(j){
  const comp = j?.header?.competitions?.[0];
  const out = {d:Date.parse(comp?.date)||0, t:[]};
  const hc = (comp?.competitors||[]).find(c=>c.homeAway==="home");
  const homeId = String(hc?.id || hc?.team?.id || "");
  for(const t of (j?.boxscore?.players||[])){
    const tid = String(t.team?.id||""), sk = [], gl = [];
    for(const grp of (t.statistics||[])){
      const L = grp.labels||[], N = grp.names||[], KS = grp.keys||[];
      const gname = String(grp.name||grp.text||grp.displayName||grp.type||"").toLowerCase();
      const ix = (...c) => { for(const x of c){ let i = L.indexOf(x); if(i<0) i = N.indexOf(x); if(i<0) i = KS.indexOf(x); if(i>=0) return i; } return -1; };
      const iSA = ix("SA","shotsAgainst"), iSV = ix("SV","saves"), iGA = ix("GA","goalsAgainst");
      const isG = /goal(ie|tend)/.test(gname) || (iSA>=0 && (iSV>=0 || iGA>=0));
      const iT = ix("TOI","timeOnIce");
      if(isG){
        for(const a of (grp.athletes||[])){
          if(a.didNotPlay || !a.stats?.length) continue;
          const s = a.stats, n = i => i>=0 ? (parseFloat(s[i])||0) : 0;
          let sa = n(iSA), ga = iGA>=0 ? n(iGA) : sa-n(iSV);
          const m = iT>=0 ? toi(s[iT]) : 0;
          if(!(m>0) && !(sa>0)) continue;
          gl.push([String(a.athlete?.id||""), r1(m), sa, ga, a.starter?1:0]);
        }
      } else {
        const iG = ix("G","goals"), iA = ix("A","assists"), iS = ix("SOG","shotsOnGoal"), iS2 = ix("S","shotsTotal","shots");
        const grpPos = /def/.test(gname) ? "D" : /forw/.test(gname) ? "F" : "";
        for(const a of (grp.athletes||[])){
          if(a.didNotPlay || !a.stats?.length) continue;
          const s = a.stats, n = i => i>=0 ? (parseFloat(s[i])||0) : 0;
          const m = iT>=0 ? toi(s[iT]) : 0; if(!(m>0)) continue;
          const pos = a.athlete?.position?.abbreviation || grpPos;
          sk.push([String(a.athlete?.id||""), pos, r1(m), n(iG), n(iA), iS>=0 ? n(iS) : n(iS2)]);
        }
      }
    }
    if(gl.length && !gl.some(g=>g[GK.st])){ let b = gl[0]; for(const g of gl) if(g[GK.toi]>b[GK.toi]) b = g; b[GK.st] = 1; }
    const pp = teamPP(j, tid);
    out.t.push({id:tid, s:sk, g:gl, h: tid===homeId ? 1 : 0, pp});
  }
  return out.t.length===2 && out.t.every(x=>x.s.length) ? out : null;
}

async function loadForGame(G, step){
  const t = G.date.getTime(), ids = [G.away.id, G.home.id];

/* ================= league + team ratings ================= */
function leagueBase(t){
  let goals=0, sog=0, sa=0, ga=0, ppg=0, ppo=0, n=0;
  for(const id in BOX){
    const b = BOX[id]; if(!b || b.d >= t-2*3600e3) continue;
    const [x,y] = b.t;
    for(const [me,op] of [[x,y],[y,x]]){
      goals += goalsOf(me); sog += sogOf(me,op); n++;
      for(const g of me.g){ sa += g[GK.sa]; ga += g[GK.ga]; }
      if(me.pp){ ppg += me.pp[0]; ppo += me.pp[1]; }
    }
  }
  const def = {gpg:3.05, sog:28.5, sv:0.900, pp:0.21};
  if(n<20) return {...def, fin:def.gpg/def.sog, n};
  const o = {gpg:goals/n, sog:sog/n, sv: sa>500 ? 1-ga/sa : def.sv, pp: ppo>100 ? ppg/ppo : def.pp, n};
  o.fin = o.gpg/o.sog;
  return o;
}

function sideRows(id, t, n){
  const rows = [];
  for(const g of sampleGames(id, t, n)){
    const b = BOX[g.id]; if(!b) continue;
    const me = b.t.find(x=>x.id===id), op = b.t.find(x=>x.id!==id); if(!me||!op) continue;
    const st = me.g.find(x=>x[GK.st]);
    rows.push({gid:g.id, d:b.d, home:!!me.h, me, op, gf:goalsOf(me), ga:goalsOf(op), sf:sogOf(me,op), sa:sogOf(op,me), starter: st ? st[GK.id] : null});
  }
  return rows.sort((a,b)=>b.d-a.d);
}

function teamRatings(id, t, lg){
  const rows = sideRows(id, t, teamWin());
  const n = rows.length;
  const out = {n, rows, off:lg.gpg, def:lg.gpg, sfPG:lg.sog, saPG:lg.sog, rawGD:0, l5:NaN, homeGD:NaN, roadGD:NaN, nh:0, nr:0, gfPG:NaN, gaPG:NaN, pp:NaN, pk:NaN};
  if(!n) return out;
  const hr = rows.filter(r=>r.home), rr = rows.filter(r=>!r.home);
  // offense: half actual goals, half shot volume at league finishing; defense: shots allowed at league finishing (goalies are handled on their own)
  let off = mean(rows.map(r=>0.5*r.gf + 0.5*r.sf*lg.fin));
  let def = mean(rows.map(r=>r.sa*lg.fin));
  const nudge = (HIA/2)*(hr.length-rr.length)/n;
  off -= nudge; def += nudge;
  const k = 8;
  out.off = (n*off + k*lg.gpg)/(n+k);
  out.def = (n*def + k*lg.gpg)/(n+k);
  out.sfPG = (n*mean(rows.map(r=>r.sf)) + k*lg.sog)/(n+k);
  out.saPG = (n*mean(rows.map(r=>r.sa)) + k*lg.sog)/(n+k);
  const gd = rs => rs.length ? mean(rs.map(r=>r.gf-r.ga)) : NaN;
  out.rawGD = gd(rows); out.l5 = gd(rows.slice(0,5));
  out.homeGD = gd(hr); out.roadGD = gd(rr); out.nh = hr.length; out.nr = rr.length;
  out.gfPG = mean(rows.map(r=>r.gf)); out.gaPG = mean(rows.map(r=>r.ga));
  const pr = rows.filter(r=>r.me.pp && r.op.pp);
  if(pr.length>=3){
    const g = pr.reduce((s,r)=>s+r.me.pp[0],0), o = pr.reduce((s,r)=>s+r.me.pp[1],0);
    const ga = pr.reduce((s,r)=>s+r.op.pp[0],0), oa = pr.reduce((s,r)=>s+r.op.pp[1],0);
    if(o>0) out.pp = g/o; if(oa>0) out.pk = 1-ga/oa;
  }
  return out;
}

/* ================= rest, travel, schedule spot ================= */
function scheduleSpot(id, G, isHome){
  const t = G.date.getTime(), today = etDayNum(t);
  const prior = (state.sched[id]||[]).filter(e=>e.d < t-3*3600e3).sort((a,b)=>b.d-a.d);
  const last = prior[0];
  const rest = last ? today - etDayNum(last.d) - 1 : 7;
  const notes = []; let v = 0;
  const b2b = rest===0;
  if(b2b){
    v -= 0.12; notes.push(["Second night of a back-to-back", -0.12]);
    if(!isHome && !last.home){ v -= 0.04; notes.push(["Both nights on the road", -0.04]); }
    const from = last.home ? id : last.opp, zones = Math.abs(tzOf(from) - tzOf(G.home.id));
    if(zones>=2){ v -= 0.04; notes.push([`Overnight flight across ${zones} time zones`, -0.04]); }
  }
  const in4 = 1 + prior.filter(e=>today-etDayNum(e.d) <= 3).length;
  const in6 = 1 + prior.filter(e=>today-etDayNum(e.d) <= 5).length;
  if(in4>=3){ v -= 0.05; notes.push([`${in4} games in 4 nights`, -0.05]); }
  else if(in6>=4){ v -= 0.03; notes.push([`${in6} games in 6 nights`, -0.03]); }
  let trip = 0;
  if(!isHome){ trip = 1; for(const e of prior){ if(e.home) break; trip++; } if(trip>=5){ v -= 0.04; notes.push([`Game ${trip} of a road trip`, -0.04]); } }
  return {v, notes, rest, b2b, trip, lastId: last?.id};
}

/* ================= skaters ================= */
function playerImpact(gp, g, a, toiPG, grp){
  const pg = (g + 0.6*a)/Math.max(1,gp);
  let v = (pg - PRI[grp].repl)*0.45;
  if(grp==="D") v += Math.max(0, toiPG-17)*0.012;
  return clamp(v*gp/(gp+4), -0.03, 0.4);
}
function buildSkaters(teamId, t, Ro, lg, spot){
  const roster = state.rosters[teamId] || [];
  const rows = sideRows(teamId, t, playerWin());
  const logs = new Map();
  rows.forEach((r,ri)=>{ for(const p of r.me.s){
    if(!logs.has(p[0])) logs.set(p[0], []);
    logs.get(p[0]).push({ri, toi:p[K.toi], g:p[K.g], a:p[K.a], sog:p[K.sog], pos:p[K.pos]});
  }});
  const nG = Math.max(1, rows.length), n5 = Math.max(1, Math.min(5, rows.length));
  // the lineup the ratings were built on: every skater who played, weighted by how often
  let base = 0;
  for(const [id, log] of logs){
    const grp = posGroup(log[0].pos || POS[id]); if(grp==="G") continue;
    const tt = log.reduce((s,x)=>s+x.toi,0);
    base += log.length/nG * playerImpact(log.length, log.reduce((s,x)=>s+x.g,0), log.reduce((s,x)=>s+x.a,0), tt/log.length, grp);
  }
  const grpTOI = grp => rows.length ? mean(rows.map(r=>r.me.s.filter(p=>posGroup(p[K.pos]||POS[p[0]])===grp).reduce((s,p)=>s+p[K.toi],0))) : (grp==="F"?183:120);
  const shotEnv = clamp(Math.pow(Ro.saPG/lg.sog, 0.8), 0.85, 1.15);
  const out = [], unknown = [];
  for(const r of roster){
    const grp = posGroup(r.pos || POS[r.id]); if(grp==="G") continue;
    const log = logs.get(r.id) || [];
    const prob = playProb(r.status);
    if(!log.length){ if(r.status) unknown.push({...r, prob, g:grp}); continue; }
    const r10 = log.slice(0,10), w = r10.map((_,i)=>Math.pow(0.85,i));
    let min = r10.reduce((s,g,i)=>s+g.toi*w[i],0)/w.reduce((a,b)=>a+b,0);
    if(spot.b2b) min *= 0.98;
    const T = log.reduce((s,x)=>s+x.toi,0), G_ = log.reduce((s,x)=>s+x.g,0), A_ = log.reduce((s,x)=>s+x.a,0), SOG = log.reduce((s,x)=>s+x.sog,0);
    const pri = PRI[grp];
    const sog60 = (SOG + pri.sog60*3)/((T+180)/60) * shotEnv;
    const sh = (G_ + pri.sh*30)/(SOG + 30);
    const a60 = (A_ + pri.a60*5)/((T+300)/60);
    const share = log.length/nG, rs = log.filter(x=>x.ri<5).length/n5;
    out.push({id:r.id, name:r.name, pos:r.pos||log[0].pos||grp, g:grp, status:r.status, why:r.why, prob, share, rs,
              key: min*(0.3+0.7*rs), min, sog60, sh, g60: sog60*sh, a60, shotEnv,
              impact: playerImpact(log.length, G_, A_, T/log.length, grp), gp:log.length, ppg:(G_+A_)/log.length});
  }
  out.sort((a,b)=>b.key-a.key);
  return {players: out, unknown, base, Fmin: grpTOI("F"), Dmin: grpTOI("D"), rows};
}
// who dresses: the top 12 forwards and 6 defensemen available, by usual role
function dress(ps){
  let f = 0, d = 0, sum = 0;
  for(const p of ps){
    p.dr = false;
    if(!p.on) continue;
    if(p.g==="F" && f<12){ p.dr = true; f++; sum += p.impact; }
    else if(p.g==="D" && d<6){ p.dr = true; d++; sum += p.impact; }
  }
  return sum;
}

/* ================= goalies ================= */
function buildGoalies(teamId, rows, lg, spot, probable){
  const roster = (state.rosters[teamId]||[]).filter(p=>posGroup(p.pos)==="G");
  const recent = rows.slice(0,10);
  const list = roster.map(r=>{
    const prob = playProb(r.status);
    let w = 0.12;
    recent.forEach((x,i)=>{ if(x.starter===r.id) w += Math.pow(0.85,i); });
    const startedLast = rows[0] && rows[0].starter===r.id && spot.lastId && rows[0].gid===spot.lastId;
    if(spot.b2b && startedLast) w *= 0.3;
    // talent: this season plus half of last season, then mixed with league-average shots
    const s = GSTAT[r.id];
    let sa = 0, ga = 0, src = "";
    if(s && (s.cur || s.prev)){
      if(s.cur){ sa += s.cur.sa; ga += s.cur.ga; }
      if(s.prev){ sa += 0.5*s.prev.sa; ga += 0.5*s.prev.ga; }
      src = s.cur ? `${s.cur.gp||"?"} GP this season, ${svp(1-s.cur.ga/s.cur.sa)}` : `last season ${svp(1-s.prev.ga/s.prev.sa)}`;
    } else {
      for(const x of rows) for(const g of x.me.g) if(g[GK.id]===r.id){ sa += g[GK.sa]; ga += g[GK.ga]; }
      src = sa ? `${svp(1-ga/sa)} in recent games` : "no NHL sample";
    }
    const sv = (sa - ga + lg.sv*SV_K)/(sa + SV_K);
    const starts = recent.filter(x=>x.starter===r.id).length;
    return {id:r.id, name:r.name, status:r.status, why:r.why, avail:prob, w: w*prob, sv, mult:(1-sv)/(1-lg.sv), src, starts, startedLast};
  });
  let tot = list.reduce((s,g)=>s+g.w,0);
  const pr = probable && list.find(g=>g.id===String(probable.id) && g.avail>0);
  if(pr){
    const p = /confirm/i.test(probable.status||"") ? 0.97 : 0.88, rest = tot - pr.w;
    list.forEach(g=>{ g.p = g===pr ? p : rest>0 ? (1-p)*g.w/rest : 0; });
    pr.probable = probable.status || "Probable";
  } else list.forEach(g=>{ g.p = tot>0 ? g.w/tot : 0; });
  if(!list.some(g=>g.p>0)) list.push({id:"", name:"Unknown goalie", status:"", avail:1, p:1, sv:lg.sv, mult:1, src:"no data", starts:0});
  list.sort((a,b)=>b.p-a.p);
  return list;
}

/* ================= market ================= */
const impl = ml => ml<0 ? -ml/(-ml+100) : 100/(ml+100);
function parseOdds(c, home, away){
  const o = (c.odds||[])[0]; if(!o) return {};
  const num = v => { const x = parseFloat(String(v ?? "").replace(/[^\d.+-]/g,"")); return isFinite(x) ? x : NaN; };
  const total = num(o.overUnder);
  let mlH = num(o.homeTeamOdds?.moneyLine ?? o.moneyline?.home?.close?.odds ?? o.moneyline?.home?.open?.odds);
  let mlA = num(o.awayTeamOdds?.moneyLine ?? o.moneyline?.away?.close?.odds ?? o.moneyline?.away?.open?.odds);
  const det = String(o.details||"");
  let pH = NaN;
  if(isFinite(mlH) && isFinite(mlA) && Math.abs(mlH)>=100 && Math.abs(mlA)>=100){ const a = impl(mlH), b = impl(mlA); pH = a/(a+b); }
  else {
    const m = det.match(/^([A-Z]{2,4})\s*([+-]?\d{3,})/);
    if(m){ const p = impl(parseFloat(m[2])) - 0.012; pH = m[1]===home.abbr ? p : m[1]===away.abbr ? 1-p : NaN; }
    else if(/\b(even|pk|pick)\b/i.test(det)) pH = 0.5;
  }
  return {total: isFinite(total) ? total : NaN, pH, details:det};
}
// home win chance and P(total > line) for given expected goals, with ties settled in OT/shootout
function marketCalc(lh, la, line){
  let ph = 0, over = 0, tie = 0;
  const q = lh/(lh+la), otH = clamp(0.5 + 1.2*(q-0.5), 0.1, 0.9);
  for(let h=0; h<=14; h++){ const p1 = poisPMF(lh,h); for(let a=0; a<=14; a++){
    const p = p1*poisPMF(la,a);
    if(h>a) ph += p; else if(h===a){ tie += p; ph += p*otH; }
    const tot = h+a+(h===a?1:0);
    if(isFinite(line)) over += tot>line ? p : 0;
  }}
  return {ph, over, tie};
}
function solveMarket(pH, line, guessT){
  let T = isFinite(line) ? line : guessT, q = 0.5;
  for(let it=0; it<4; it++){
    if(isFinite(line)){ let lo = 3, hi = 10; for(let k=0;k<30;k++){ const m=(lo+hi)/2; if(marketCalc(m*q, m*(1-q), line).over < 0.5) lo = m; else hi = m; } T = (lo+hi)/2; }
    if(isFinite(pH)){ let lo = 0.25, hi = 0.75; for(let k=0;k<30;k++){ const m=(lo+hi)/2; if(marketCalc(T*m, T*(1-m)).ph < pH) lo = m; else hi = m; } q = (lo+hi)/2; }
  }
  return {lh:T*q, la:T*(1-q)};
}

/* ================= model ================= */
function buildModel(G){
  const t = G.date.getTime(), H = G.home, A = G.away;
  const lg = leagueBase(t);
  const RH = teamRatings(H.id, t, lg), RA = teamRatings(A.id, t, lg);
  const spotH = scheduleSpot(H.id, G, true), spotA = scheduleSpot(A.id, G, false);
  const PH = buildSkaters(H.id, t, RA, lg, spotH), PA = buildSkaters(A.id, t, RH, lg, spotA);
  const GH = buildGoalies(H.id, PH.rows, lg, spotH, H.probable), GA = buildGoalies(A.id, PA.rows, lg, spotA, A.probable);
  const lH0 = RH.off*RA.def/lg.gpg, lA0 = RA.off*RH.def/lg.gpg;
  const F = [];   // each factor in home goal margin

  const st = (ab, R) => isFinite(R.pp) ? `, PP ${pct(R.pp)} / PK ${pct(R.pk)}` : "";
  F.push({k:"base", t:"Team strength", v:lH0-lA0,
    d:`Last ${Math.max(RH.n,RA.n)} games, shot-adjusted and home/road mix removed. ${H.abbr} ${f2(RH.gfPG)} GF / ${f2(RH.gaPG)} GA, ${f1(RH.sfPG)}–${f1(RH.saPG)} shots${st(H.abbr,RH)}. ${A.abbr} ${f2(RA.gfPG)} / ${f2(RA.gaPG)}, ${f1(RA.sfPG)}–${f1(RA.saPG)} shots${st(A.abbr,RA)}. With average goalies: ${f2(lA0)}–${f2(lH0)}.`});
  const form = R => R.n>=5 && isFinite(R.l5) ? clamp(0.1*(R.l5-R.rawGD), -0.15, 0.15) : 0;
  const fH = form(RH), fA = form(RA);
  F.push({k:"form", t:"Recent form", v:fH-fA,
    d:`Goal differential over the last 5 vs their sample: ${H.abbr} ${sgn(isFinite(RH.l5)?RH.l5-RH.rawGD:0)}, ${A.abbr} ${sgn(isFinite(RA.l5)?RA.l5-RA.rawGD:0)} per game (10% weight).`});
  F.push({k:"hia", t:"Home ice", v:HIA, d:`${H.name} at home, with last change. League-wide home edge.`});
  const split = R => R.nh>=3 && R.nr>=3 ? clamp(((R.homeGD-R.roadGD)/2 - HIA)*Math.min(R.nh,R.nr)/(Math.min(R.nh,R.nr)+20)*0.5, -0.15, 0.15) : 0;
  const sH = split(RH), sA = split(RA);
  F.push({k:"split", t:"Home/road splits", v:sH+sA,
    d:`${H.abbr} home goal diff ${isFinite(RH.homeGD)?sgn(RH.homeGD):"–"} (${RH.nh} g), ${A.abbr} road ${isFinite(RA.roadGD)?sgn(RA.roadGD):"–"} (${RA.nr} g); shrunk hard toward the league norm.`});
  const restTxt = (ab, s) => s.notes.length ? `${ab}: ${s.notes.map(n=>`${n[0].toLowerCase()} (${sgn(n[1])})`).join(", ")}` : `${ab}: ${s.rest>=7?"first game of the stretch":s.rest+" day"+(s.rest===1?"":"s")+" rest"}`;
  F.push({k:"rest", t:"Rest, travel and schedule", v:spotH.v-spotA.v, d:`${restTxt(H.abbr,spotH)}. ${restTxt(A.abbr,spotA)}. Goalie rotation on back-to-backs is handled under Goaltending.`});

  // expected lineup effects, from a quick pass of random lineups
  let eH = 0, eA = 0; const LN = 2000;
  for(let i=0;i<LN;i++){
    for(const p of PH.players) p.on = Math.random()<p.prob;
    for(const p of PA.players) p.on = Math.random()<p.prob;
    eH += dress(PH.players)-PH.base; eA += dress(PA.players)-PA.base;
  }
  eH /= LN; eA /= LN;
  const shiftConst = F.filter(f=>f.k!=="base").reduce((s,f)=>s+f.v,0);
  const meanH0 = lH0 + shiftConst/2, meanA0 = lA0 - shiftConst/2;
  const preH = meanH0 + 0.6*eH - 0.4*eA, preA = meanA0 + 0.6*eA - 0.4*eH;
  const Em = gl => gl.reduce((s,g)=>s+g.p*g.mult,0);
  const mH = Em(GH), mA = Em(GA);
  const gTxt = (ab, gl) => `${ab}: ${gl.filter(g=>g.p>=0.05).map(g=>`${lastName(g.name)} ${pct(g.p)} to start (${svp(g.sv)})`).join(", ")||"unknown"}`;
  F.push({k:"goalie", t:"Goaltending", v:preH*(mA-1) - preA*(mH-1),
    d:`${gTxt(H.abbr,GH)}. ${gTxt(A.abbr,GA)}. League ${svp(lg.sv)}. Save rates mix in ${SV_K.toLocaleString()} shots of league-average play.`});
  const avTxt = (ab, list) => {
    const m = list.filter(p=>p.prob<1 || p.share<0.6).map(p=>({p, v:(p.prob-p.share)*p.impact})).filter(x=>Math.abs(x.v)>=0.02)
      .sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
    return m.length ? `${ab}: ${m.map(({p,v})=>`${lastName(p.name)} ${p.prob===0?"out":p.prob<1?Math.round(p.prob*100)+"% to play":"in"} (${sgn(v)})`).join(", ")}` : `${ab}: no change from the usual lineup`;
  };
  F.push({k:"avail", t:"Skater availability", v:eH-eA, d:`${avTxt(H.abbr,PH.players)}. ${avTxt(A.abbr,PA.players)}. Includes trades and call-ups. Doubtful players are coin-flipped in every simulation.`});

  const expH = preH*mA, expA = preA*mH;
  let shiftH = 0, shiftA = 0;
  const vT = G.odds?.total, vP = G.odds?.pH, w = settings.vegas;
  if(w>0 && (isFinite(vT) || isFinite(vP))){
    const mk = solveMarket(isFinite(vP) ? vP : marketCalc(expH, expA).ph, vT, expH+expA);
    shiftH = w*(mk.lh-expH); shiftA = w*(mk.la-expA);
    F.push({k:"vegas", t:"Market blend", v:shiftH-shiftA, d:`${Math.round(w*100)}% pull toward the Vegas line${isFinite(vT)?`; total moved ${sgn(shiftH+shiftA)}`:""}. Change this in Settings.`});
  }
  const team = (meta, R, P, gl, mean0) => ({meta, R, ps:P.players, unknown:P.unknown, base:P.base, Fmin:P.Fmin, Dmin:P.Dmin, gl, mean0});
  return {G, lg, F, meanH0, meanA0, shiftH, shiftA, expH:expH+shiftH, expA:expA+shiftA, vT, vP,
          playoff:!!G.playoff, home:team(H, RH, PH, GH, meanH0), away:team(A, RA, PA, GA, meanA0), spotH, spotA, thin: RH.n<3 || RA.n<3};
}

/* ================= simulation ================= */
function allocate(T, goals, i, otMin, lam){
  const ps = T.ps;
  let sF = 0, sD = 0;
  for(const p of ps) if(p.dr){ if(p.g==="F") sF += p.min; else sD += p.min; }
  const kF = sF ? clamp(T.Fmin/sF, 0.85, 1.35) : 1, kD = sD ? clamp(T.Dmin/sD, 0.85, 1.35) : 1;
  const ot = 1 + otMin*0.6/60;
  const dr = [];
  for(const p of ps){
    if(!p.dr){ p.s.toi[i] = NaN; continue; }
    p.dr_n++;
    p._m = Math.min(p.min*1.35, p.min*(p.g==="F"?kF:kD))*ot;
    p._g = 0; p._a = 0;
    dr.push(p);
  }
  for(let k=0;k<goals;k++){
    const sc = pickW(dr, p=>p._m*p.g60); if(!sc) break;
    sc._g++;
    const u = Math.random(), na = u<0.07 ? 0 : u<0.3 ? 1 : 2;
    let a1 = null;
    if(na>=1){ a1 = pickW(dr, p=>p._m*p.a60, sc); if(a1) a1._a++; }
    if(na>=2 && a1){ const a2 = pickW(dr, p=>p===a1?0:p._m*p.a60, sc); if(a2) a2._a++; }
  }
  const lift = Math.pow((goals+0.5)/(lam+0.5), 0.25);
  let sog = 0;
  for(const p of dr){
    const s = p._g + negbin(p._m/60*p.sog60*(1-p.sh)*lift, 8);
    p.s.toi[i] = p._m; p.s.g[i] = p._g; p.s.a[i] = p._a; p.s.sog[i] = s;
    sog += s;
  }
  return sog;
}

function simulate(M, N){
  const H = M.home, A = M.away;
  for(const T of [H,A]){
    for(const p of T.ps){ p.dr_n = 0; p.s = {toi:new Float32Array(N), g:new Float32Array(N), a:new Float32Array(N), sog:new Float32Array(N)}; }
    for(const g of T.gl){ g.n = 0; g.sv_ = 0; g.ga_ = 0; g.so_ = 0; g.w_ = 0; g.svs = []; }
  }
  const hp = new Int16Array(N), ap = new Int16Array(N), how = new Uint8Array(N);   // how: 0 regulation, 1 OT, 2 shootout
  const pickG = gl => { let r = Math.random(); for(const g of gl){ r -= g.p; if(r<=0) return g; } return gl[0]; };
  for(let i=0;i<N;i++){
    for(const p of H.ps) p.on = Math.random()<p.prob;
    for(const p of A.ps) p.on = Math.random()<p.prob;
    const dH = dress(H.ps)-H.base, dA = dress(A.ps)-A.base;
    const gH = pickG(H.gl), gA = pickG(A.gl);
    const pace = Math.exp(0.06*gauss());
    let lH = Math.max(0.8, (M.meanH0 + 0.6*dH - 0.4*dA)*gA.mult + M.shiftH) * pace * Math.exp(0.1*gauss());
    let lA = Math.max(0.8, (M.meanA0 + 0.6*dA - 0.4*dH)*gH.mult + M.shiftA) * pace * Math.exp(0.1*gauss());
    const rH = Math.max(0.5, lH-EN_SUB)/60, rA = Math.max(0.5, lA-EN_SUB)/60;
    let h = poisson(rH*57), a = poisson(rA*57), enH = 0, enA = 0;
    // last three minutes: trailing by one or two, the goalie comes out
    const m = h-a;
    if(Math.abs(m)===1 || Math.abs(m)===2){
      const lead = m>0 ? "h" : "a", rT = lead==="h" ? rA : rH, rL = lead==="h" ? rH : rA;
      const pT = clamp((Math.abs(m)===1 ? 0.12 : 0.05)*rT*60/3.0, 0.03, 0.22), pL = clamp(0.32*Math.pow(rL*60/3.0,0.5), 0.2, 0.45);
      const u = Math.random();
      if(u<pT){ if(lead==="h") a++; else h++; }
      else if(u<pT+pL){ if(lead==="h"){ h++; enH++; } else { a++; enA++; } }
    } else { h += poisson(rH*3); a += poisson(rA*3); }
    let otMin = 0, so = 0, kind = 0;
    if(h===a){
      const q = rH/(rH+rA);
      if(M.playoff){
        const rate = (rH+rA)*0.9, t = -Math.log(1-Math.random())/rate;
        otMin = Math.min(t, 60); kind = 1;
        if(Math.random()<q) h++; else a++;
      } else {
        const rate = (rH+rA)*1.85, t = -Math.log(1-Math.random())/rate;
        if(t<5){ otMin = t; kind = 1; if(Math.random() < clamp(0.5+1.2*(q-0.5),0.1,0.9)) h++; else a++; }
        else { otMin = 5; kind = 2; so = Math.random() < 0.5+0.5*(q-0.5) ? 1 : -1; }
      }
    }
    const sogH = allocate(H, h, i, otMin, lH), sogA = allocate(A, a, i, otMin, lA);
    // goalies: shots on goal they faced exclude empty-netters
    const fin = (g, oppSog, oppGoals, en, won) => { g.n++; const ga = oppGoals-en; const sv = Math.max(0, oppSog-oppGoals); g.sv_ += sv; g.ga_ += ga; g.svs.push(sv); if(oppGoals===0) g.so_++; if(won) g.w_++; };
    const hw = so ? so>0 : h>a;
    fin(gH, sogA, a, enA, hw); fin(gA, sogH, h, enH, !hw);
    hp[i] = h + (so>0?1:0); ap[i] = a + (so<0?1:0); how[i] = kind;
  }
  return {N, hp, ap, how};
}

const qtile = (sorted, q) => sorted.length ? sorted[Math.min(sorted.length-1, Math.floor(q*sorted.length))] : NaN;
function summarize(M, R){
  const N = R.N; let hw = 0, ot = 0, so = 0, over = 0, opush = 0, pl = 0, rh = 0, ra = 0;
  const totals = new Float32Array(N), margins = new Float32Array(N), sc = new Map();
  const {vT} = M;
  for(let i=0;i<N;i++){ if(R.hp[i]>R.ap[i]) hw++; }
  const winH = hw/N;
  // puck line goes to the market favourite, or the model's when there's no line
  const favH = isFinite(M.vP) ? M.vP>=0.5 : winH>=0.5;
  for(let i=0;i<N;i++){
    const m = R.hp[i]-R.ap[i], tt = R.hp[i]+R.ap[i];
    margins[i] = m; totals[i] = tt;
    if(R.how[i]) ot++; if(R.how[i]===2) so++;
    if(!R.how[i]){ if(m>0) rh++; else ra++; }
    if((favH ? m : -m) >= 2) pl++;
    if(isFinite(vT)){ if(tt>vT) over++; else if(tt===vT) opush++; }
    const k = R.hp[i]+"-"+R.ap[i]; sc.set(k, (sc.get(k)||0)+1);
  }
  const st = Float32Array.from(totals).sort();
  const top = [...sc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,c])=>({h:+k.split("-")[0], a:+k.split("-")[1], p:c/N}));
  const players = {};
  for(const T of [M.home, M.away]) for(const p of T.ps){
    const o = {play: p.dr_n/N};
    const idx = []; for(let i=0;i<N;i++) if(!isNaN(p.s.toi[i])) idx.push(i);
    const pts = idx.map(i=>p.s.g[i]+p.s.a[i]);
    const stat = arr => { const v = arr.slice().sort((a,b)=>a-b); return {mean:mean(v), p10:qtile(v,0.1), p50:qtile(v,0.5), p90:qtile(v,0.9)}; };
    for(const k of ["toi","g","a","sog"]) o[k] = stat(idx.map(i=>p.s[k][i]));
    o.pts = stat(pts);
    const share = f => idx.length ? idx.filter(f).length/idx.length : NaN;
    o.g1 = share(i=>p.s.g[i]>=1); o.g2 = share(i=>p.s.g[i]>=2);
    o.p1 = pts.length ? pts.filter(x=>x>=1).length/pts.length : NaN; o.p2 = pts.length ? pts.filter(x=>x>=2).length/pts.length : NaN;
    o.a1 = share(i=>p.s.a[i]>=1);
    o.s2 = share(i=>p.s.sog[i]>=2); o.s3 = share(i=>p.s.sog[i]>=3); o.s4 = share(i=>p.s.sog[i]>=4);
    players[p.id] = o;
    delete p.s;
  }
  const goalies = {};
  for(const T of [M.home, M.away]) for(const g of T.gl){
    const v = g.svs.sort((a,b)=>a-b);
    goalies[g.id] = {start:g.n/N, sv:g.n?g.sv_/g.n:NaN, ga:g.n?g.ga_/g.n:NaN, svp:(g.sv_+g.ga_)?g.sv_/(g.sv_+g.ga_):NaN,
                     so:g.n?g.so_/g.n:NaN, win:g.n?g.w_/g.n:NaN, sv10:qtile(v,0.1), sv90:qtile(v,0.9)};
    delete g.svs;
  }
  return {N, winH, meanH: mean(Array.from(R.hp)), meanA: mean(Array.from(R.ap)),
          margin: mean(Array.from(margins)), total: mean(Array.from(totals)), t10:qtile(st,0.1), t90:qtile(st,0.9),
          ot: ot/N, so: so/N, reg:{h:rh/N, a:ra/N}, favH, pl: pl/N, over: isFinite(vT) ? over/N : NaN, opush: isFinite(vT) ? opush/N : NaN,
          top, hist: histogram(margins), players, goalies};
}
function histogram(margins){
  const lo = -5, hi = 5, bins = new Array(10).fill(0);   // −5+ … −1, +1 … +5+
  for(const m of margins){ const c = clamp(m, lo, hi); bins[c<0 ? c-lo : c-lo-1]++; }
  return {lo, bins};
}
const fairML = p => { if(!(p>0&&p<1)) return "–"; return p>=0.5 ? "−"+Math.round(100*p/(1-p)) : "+"+Math.round(100*(1-p)/p); };

/* ================= schedule (home) ================= */
async function loadGames(){
  state.games = null; state.gamesErr = null; renderHome();
  const want = state.day;
  try{
    const j = await getJSON(`${S}/site/v2/sports/hockey/nhl/scoreboard?dates=${want}`);
    if(state.day!==want) return;
    state.games = (j.events||[]).map(e=>{
      const c = e.competitions?.[0]||{};
      const team = h => { const x = (c.competitors||[]).find(t=>t.homeAway===h); if(!x) return null;
        const rec = (x.records||[]).find(r=>r.type==="total"||r.name==="overall")?.summary || "";
        const pr = (x.probables||[]).find(p=>p.athlete);
        return {id:String(x.team?.id||x.id), abbr:x.team?.abbreviation, name:x.team?.shortDisplayName||x.team?.name, logo:x.team?.logo||teamById(x.team?.id)?.logo,
                color:x.team?.color, rec, score: parseInt(x.score?.value ?? x.score),
                probable: pr ? {id:String(pr.athlete.id), name:pr.athlete.displayName||"", status:pr.status?.name||pr.status?.description||(typeof pr.status==="string"?pr.status:"")} : null}; };
      const st = c.status?.type || e.status?.type || {};
      const away = team("away"), home = team("home");
      return {id:String(e.id), date:new Date(e.date), away, home, state:st.state, playoff: String(e.season?.type ?? c.season?.type ?? "")==="3",
              odds: away&&home ? parseOdds(c, home, away) : {},
              status: st.state==="pre" ? new Date(e.date).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : (st.shortDetail||st.description||"")};
    }).filter(g=>g.away && g.home);
    if(!state.autoAdvanced && want===etYMD(new Date()) && (!state.games.length || state.games.every(g=>g.state==="post"))){
      state.autoAdvanced = true; state.day = shiftDay(want,1); return loadGames();
    }
    state.autoAdvanced = true;
  }catch(err){ state.gamesErr = err.message; }
  renderHome();
}
const oddsTxt = o => [o.details, isFinite(o.total) ? `O/U ${o.total}` : ""].filter(Boolean).join(", ");

function resultLine(g){
  const r = state.results[g.id];
  if(!r) return `<div class="res"><span class="tap">Tap to simulate</span><span class="muted">›</span></div>`;
  const hw = r.winH>=0.5, fav = hw ? g.home : g.away, p = hw ? r.winH : 1-r.winH;
  let actual = "";
  if(g.state==="post" && isFinite(g.home.score)){
    const right = (g.home.score>g.away.score) === hw;
    actual = ` <span class="${right?"good":"bad"}">${right?"✓":"✗"}</span>`;
  }
  return `<div class="res"><span><b>${esc(fav.abbr)}</b> wins <b class="n">${pct(p)}</b>${actual}</span>
    <span><span class="n">${f1(r.meanA)}</span> – <span class="n">${f1(r.meanH)}</span></span></div>`;
}

function renderHome(){
  state.view = "home";
  let list;
  const today = etYMD(new Date()), tmr = shiftDay(today,1);
  if(state.gamesErr) list = `<div class="err">Couldn’t load the schedule (${esc(state.gamesErr)}). Check your connection and pick the day again.</div>`;
  else if(!state.games) list = `<div class="loading"><div class="spin"></div>Loading the schedule…</div>`;
  else if(!state.games.length) list = `<div class="empty">No NHL games on this day. Use the arrows to find the next slate.</div>`;
  else list = `<div class="games">${state.games.map((g,i)=>`
      <button class="game" data-gi="${i}">
        <div class="gr">
          <span class="tm"><img src="${esc(g.away.logo)}" alt=""><span>${esc(g.away.abbr)}<br><small>${esc(g.away.rec)}</small></span></span>
          <span class="mid">${g.state==="post"&&isFinite(g.away.score)?`<b class="n" style="font-size:17px;color:var(--text)">${g.away.score}–${g.home.score}</b><br>`:"@ "}${esc(g.status)}${oddsTxt(g.odds)?`<br>${esc(oddsTxt(g.odds))}`:""}</span>
          <span class="tm"><span style="text-align:right">${esc(g.home.abbr)}<br><small>${esc(g.home.rec)}</small></span><img src="${esc(g.home.logo)}" alt=""></span>
        </div>
        ${resultLine(g)}
      </button>`).join("")}</div>`;
  const sa = state.simAll;
  const allBtn = state.games?.length ? `<button class="go" id="simall" ${sa?"disabled":""}>${sa?`Simulating ${sa.i} of ${sa.n}…`:"Simulate all games"}</button>` : "";
  $("#app").innerHTML = `
    <div class="datebar"><button id="prev" aria-label="Previous day">‹</button><div class="d">${esc(dayLabel(state.day))}</div><button id="next" aria-label="Next day">›</button></div>
    <div class="quick"><button data-day="${today}" aria-pressed="${state.day===today}">Today</button><button data-day="${tmr}" aria-pressed="${state.day===tmr}">Tomorrow</button></div>
    <div class="section"><h2><span>Scheduled games</span>${allBtn}</h2>${list}</div>`;
}

async function simAll(){
  const games = state.games.slice();
  state.simAll = {i:0, n:games.length}; renderHome();
  const N = Math.min(settings.sims, 5000);
  for(const G of games){
    state.simAll.i++; if(state.view==="home") renderHome();
    if(state.results[G.id]) continue;
    try{
      await loadForGame(G, ()=>{});
      const M = buildModel(G);
      await tick();
      state.results[G.id] = summarize(M, simulate(M, N));
    }catch(e){}
    if(state.view==="home") renderHome();
  }
  state.simAll = null;
  if(state.view==="home") renderHome();
}

/* ================= game view ================= */
let runId = 0;
function heroHTML(){
  const G = state.game, A = G.away, H = G.home;
  return `<div class="hero" style="--teamA:${esc(cleanColor(A.color)||"#3a6fd8")};--teamB:${esc(cleanColor(H.color)||"#c98a12")}">
    <button class="back">‹ Games</button>
    ${state.M ? `<button class="rerun">Run again</button>` : ""}
    <div class="row">
      <div class="side"><img src="${esc(A.logo)}" alt="">${esc(A.name)}<small>${esc(A.rec)} · away</small></div>
      <div class="at">@</div>
      <div class="side"><img src="${esc(H.logo)}" alt="">${esc(H.name)}<small>${esc(H.rec)} · home</small></div>
    </div>
    <div class="odds">${G.date ? esc(G.date.toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"})) : ""}${oddsTxt(G.odds||{})?` · Vegas ${esc(oddsTxt(G.odds))}`:""}</div>
  </div>`;
}
function step(msg, frac){
  $("#app").innerHTML = `${heroHTML()}<div class="loading"><div class="spin"></div>${esc(msg)}${frac!=null?`<div class="bar"><i style="width:${Math.round(frac*100)}%"></i></div>`:""}</div>`;
}
async function openGame(G, keepTab){
  const my = ++runId;
  state.view = "game"; state.game = G; state.open = null; state.M = null;
  if(!keepTab) state.tab = G.away.id;
  window.scrollTo(0,0);
  try{
    await loadForGame(G, (m,f)=>{ if(my===runId) step(m,f); });
    if(my!==runId) return;
    step(`Running ${settings.sims.toLocaleString()} simulations…`, 0.97);
    await tick();
    const M = buildModel(G);
    const S_ = summarize(M, simulate(M, settings.sims));
    if(my!==runId) return;
    state.M = M; state.S = S_; state.results[G.id] = S_;
    renderGame();
  }catch(err){
    if(my===runId) $("#app").innerHTML = `${heroHTML()}<div class="err">Couldn’t finish loading: ${esc(err.message)}. Go back and tap the game again.</div>`;
  }
}

function histSVG(S, H, A){
  const {lo, bins} = S.hist, max = Math.max(...bins), W = 360, Hh = 120, bw = W/bins.length;
  const ca = cleanColor(A.color)||"#3a6fd8", ch = cleanColor(H.color)||"#c98a12";
  const val = i => i<5 ? lo+i : i-4;   // −5 … −1, 1 … 5
  const bars = bins.map((c,i)=>{
    const h = max ? c/max*(Hh-30) : 0, v = val(i), col = v>0 ? ch : ca, x = i*bw;
    const lab = `${v>0?H.abbr:A.abbr} by ${Math.abs(v)}${Math.abs(v)===5?"+":""}`;
    return `<rect x="${(x+2).toFixed(1)}" y="${(Hh-16-h).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}" opacity="0.85"><title>${lab}: ${pct(c/S.N)}</title></rect>
      <text x="${(x+bw/2).toFixed(1)}" y="${(Hh-20-h).toFixed(1)}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".7">${c/S.N>=0.005?Math.round(c/S.N*100)+"%":""}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${Hh-3}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".6">${Math.abs(v)}${Math.abs(v)===5?"+":""}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Distribution of final goal margins">${bars}<line x1="${W/2}" x2="${W/2}" y1="4" y2="${Hh-16}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/></svg>`;
}

function goalieRows(M, S){
  return [M.away, M.home].flatMap(T=>T.gl.filter(g=>g.id).map(g=>{
    const o = S.goalies[g.id] || {}, out = g.avail===0;
    const tag = out ? `<span class="pill out">${esc(g.status)}</span>` : g.probable ? `<span class="pill ok">${esc(g.probable)}</span>` : g.status ? `<span class="pill q">${esc(g.status)}</span>` : "";
    const why = [`${g.starts} of last ${Math.min(10,T.R.n)||10} starts`, g.startedLast&&(T===M.home?M.spotH:M.spotA).b2b ? "started last night" : "", g.src].filter(Boolean).join(" · ");
    return `<div class="gl-row${out||o.start<0.02?" dim":""}">
      <div class="who"><img src="${head(esc(g.id))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div><b>${esc(g.name)}</b> <span class="muted">${esc(T.meta.abbr)}</span> ${tag}<div class="sub">${esc(why)}</div></div></div>
      <div class="st"><span class="n">${pct(o.start)}</span><span>to start</span></div>
      ${o.start>=0.02?`<div class="line"><span>Saves <b>${f1(o.sv)}</b></span><span>GA <b>${f1(o.ga)}</b></span><span>SV% <b>${svp(o.svp)}</b></span><span>Shutout <b>${pct(o.so)}</b></span><span>Win <b>${pct(o.win)}</b></span></div>`:""}
    </div>`;
  })).join("") || `<div class="empty">No goalies on either roster.</div>`;
}

function renderGame(){
  const M = state.M, S = state.S, G = M.G, H = G.home, A = G.away;
  const hw = S.winH>=0.5;
  const ca = cleanColor(A.color)||"#3a6fd8", ch = cleanColor(H.color)||"#c98a12";
  const fav = S.favH ? H : A, dog = S.favH ? A : H;
  let vegas = `<span>${esc(fav.abbr)} −1.5 puck line</span><span class="n ${S.pl>=0.55?"good":S.pl<=0.45?"bad":""}">${pct(S.pl)}</span>
    <span class="sub">${esc(dog.abbr)} +1.5 covers ${pct(1-S.pl)}${isFinite(M.vP)?` · Vegas has ${esc(H.abbr)} at ${pct(M.vP)} to win, model ${pct(S.winH)}`:""}</span>`;
  if(isFinite(M.vT)){
    vegas += `<span>Over ${f1(M.vT)}</span><span class="n ${S.over>=0.55?"good":S.over<=0.45?"bad":""}">${pct(S.over)}</span>
      <span class="sub">Model total ${f2(S.total)} (80% range ${S.t10}–${S.t90})${S.opush>0.005?` · push ${pct(S.opush)}`:""}. Shootout winner counts as a goal.</span>`;
  }
  const final = G.state==="post" && isFinite(H.score) ? `<div class="actual">Final: ${esc(A.abbr)} ${A.score} – ${esc(H.abbr)} ${H.score}. The model used only games played before puck drop.</div>` : "";
  const topTxt = S.top.map(s=>`${esc(A.abbr)} ${s.a}–${s.h} ${esc(H.abbr)} (${pct(s.p)})`).join(", ");

  const facs = M.F.map(f=>{
    const tm = f.v>0.005 ? H.abbr : f.v<-0.005 ? A.abbr : "";
    return `<div class="fac"><div><div class="t">${esc(f.t)}</div><div class="d">${esc(f.d)}</div></div>
      <div class="v"><span class="n">${Math.abs(f.v)<0.005?"0.00":"+"+Math.abs(f.v).toFixed(2)}</span><span>${esc(tm||"even")}</span></div></div>`;
  }).join("");
  const tot = M.F.reduce((s,f)=>s+f.v,0);

  const injRows = [M.away, M.home].flatMap(T=>[...T.ps.filter(p=>p.status), ...T.unknown, ...T.gl.filter(g=>g.status).map(g=>({...g, pos:"G", prob:g.avail}))].map(p=>({p, T}))).map(({p,T})=>{
    const im = isFinite(p.impact) && isFinite(p.share) ? (p.prob-p.share)*p.impact : NaN;
    const sub = p.pos==="G" ? " · goalie, see start odds above" : isFinite(p.share)?` · played ${Math.round(p.share*100)}% of recent games`:" · no recent games";
    return `<div class="inj-row"><div><b>${esc(p.name)}</b> <span class="muted">${esc(T.meta.abbr)} · ${esc(p.pos)}</span><div class="sub">${esc(p.why||p.status)}${sub}</div></div>
      <span class="pill ${pillClass(p.prob)}">${esc(p.status)}</span>
      <span class="n ${im<0?"bad":im>0?"good":"muted"}" title="Effect on team goal margin">${isFinite(im)?sgn(im):"–"}</span></div>`;
  }).join("") || `<div class="empty">No one on either injury report.</div>`;

  const T = state.tab===H.id ? M.home : M.away;
  const oppAbbr = (T===M.home?A:H).abbr;
  const rank = p => { const o = S.players[p.id]; return p.prob===0 || !o || o.play<0.02 ? -1 : o.pts.mean; };
  const rows = T.ps.filter(p=>p.prob<1 || (S.players[p.id]?.play ?? 0)>=0.05).sort((a,b)=>rank(b)-rank(a)).map(p=>{
    const o = S.players[p.id]; if(!o) return "";
    const off = p.prob===0 || o.play<0.02;
    const open = state.open===p.id;
    const sub = p.prob===0 ? "Out" : o.play<0.02 ? "Not expected to dress" : o.play<0.95 ? `${pct(o.play)} to dress` : `${esc(p.pos)} · ${f1(o.toi.mean)} min`;
    const v = (k,fn=f2) => off ? "–" : fn(o[k].mean);
    let detail = "";
    if(open && !off){
      detail = `<div class="detail"><table><thead><tr><th></th><th>Low</th><th>Median</th><th>High</th><th>Avg</th></tr></thead><tbody>
        ${[["TOI","toi",f1],["G","g",f2],["A","a",f2],["PTS","pts",f2],["SOG","sog",f1]].map(([l,k,fn])=>`<tr><td>${l}</td><td class="n">${k==="toi"?f1(o[k].p10):o[k].p10}</td><td class="n">${k==="toi"?f1(o[k].p50):o[k].p50}</td><td class="n">${k==="toi"?f1(o[k].p90):o[k].p90}</td><td class="n">${fn(o[k].mean)}</td></tr>`).join("")}
        </tbody></table>
        <div class="probs"><span>1+ goal <b>${pct(o.g1)}</b></span><span>2+ goals <b>${pct(o.g2)}</b></span><span>1+ assist <b>${pct(o.a1)}</b></span><span>1+ point <b>${pct(o.p1)}</b></span><span>2+ points <b>${pct(o.p2)}</b></span><span>2+ shots <b>${pct(o.s2)}</b></span><span>3+ shots <b>${pct(o.s3)}</b></span><span>4+ shots <b>${pct(o.s4)}</b></span></div>
        <p class="why">Low and high are the 10th and 90th percentile across ${S.N.toLocaleString()} simulations, counting only games he dresses.</p>
        <p class="why"><b>Matchup:</b> ${esc(oppAbbr)} allows ${p.shotEnv>=1.03?`${Math.round((p.shotEnv-1)*100)}% more shots than average, so his shot rate is raised`:p.shotEnv<=0.97?`${Math.round((1-p.shotEnv)*100)}% fewer shots than average, so his shot rate is trimmed`:"about a league-average number of shots"}. His goals and assists come from his share of the team’s simulated goals.</p>
        ${(T===M.home?M.spotH:M.spotA).b2b?`<p class="why">Back-to-back: ice time trimmed 2%.</p>`:""}
        <p class="why">Built from ${p.gp} game${p.gp>1?"s":""} with this team: ${f2(p.ppg)} points per game, ${f1(p.sog60)} shots per 60, ${pct(p.sh)} shooting (regressed).</p></div>`;
    }
    return `<button class="pr${off?" dim":""}" data-pid="${esc(p.id)}" aria-expanded="${open}">
        <span class="who"><img src="${head(esc(p.id))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span>${esc(p.name)}<small>${sub}</small></span></span>
        <span class="n">${v("g")}</span><span class="n">${v("a")}</span><span class="n">${v("pts")}</span><span class="n">${v("sog",f1)}</span><span class="n">${off?"–":pct(o.g1)}</span>
      </button>${detail}`;
  }).join("");

  $("#app").innerHTML = `${heroHTML()}
    <div class="card"><h3>Simulation result <small>${S.N.toLocaleString()} games</small></h3>
      <div class="score">
        <div class="s"><img src="${esc(A.logo)}" alt=""><span class="n ${!hw?"win":""}">${f1(S.meanA)}</span></div>
        <span class="dash">–</span>
        <div class="s"><span class="n ${hw?"win":""}">${f1(S.meanH)}</span><img src="${esc(H.logo)}" alt=""></div>
      </div>
      <div class="wp"><div class="lab"><span>${esc(A.abbr)} ${pct(1-S.winH)}</span><span>${esc(H.abbr)} ${pct(S.winH)}</span></div>
        <div class="track"><i style="width:${(1-S.winH)*100}%;background:${ca}"></i><i style="width:${S.winH*100}%;background:${ch}"></i></div></div>
      <div class="kv">
        <span>Projected winner</span><span class="n">${esc((hw?H:A).abbr)} ${pct(hw?S.winH:1-S.winH)}</span>
        <span class="sub">Most likely scores: ${topTxt}</span>
        <span>Fair moneyline</span><span class="n">${esc(A.abbr)} ${fairML(1-S.winH)} / ${esc(H.abbr)} ${fairML(S.winH)}</span>
        <span>Goes to overtime</span><span class="n">${pct(S.ot)}</span>
        <span class="sub">${M.playoff?"Playoff rules: sudden-death 5-on-5 until someone scores.":`Shootout ${pct(S.so)}. Regulation: ${esc(A.abbr)} ${pct(winReg(S,false))}, ${esc(H.abbr)} ${pct(winReg(S,true))}.`}</span>
        ${vegas}
      </div>
      ${final}
      ${M.thin?`<div class="actual">Early-season sample: fewer than 3 games of data for at least one team, so ratings lean on league averages.</div>`:""}
    </div>

    <div class="card"><h3>Final margin <small>goals, how often each came up</small></h3>
      <div class="hist">${histSVG(S,H,A)}<div class="cap"><span>← ${esc(A.abbr)} wins by</span><span>${esc(H.abbr)} wins by →</span></div></div>
    </div>

    <div class="card"><h3>What moved the number <small>goals of margin</small></h3>
      ${facs}
      <div class="fac total"><div><div class="t">Expected margin</div><div class="d">Before game-to-game randomness, empty-netters and overtime</div></div>
        <div class="v"><span class="n">${Math.abs(tot).toFixed(2)}</span><span>${esc(tot>=0?H.abbr:A.abbr)}</span></div></div>
    </div>

    <div class="card"><h3>Goalies <small>who starts, and how they project</small></h3>${goalieRows(M,S)}</div>

    <div class="card"><h3>Injury report <small>effect on margin</small></h3>${injRows}</div>

    <div class="card"><h3>Skater projections <small>tap a player</small></h3>
      <div class="tabs">
        <button data-tab="${A.id}" aria-pressed="${state.tab===A.id}"><img src="${esc(A.logo)}" alt="">${esc(A.abbr)}</button>
        <button data-tab="${H.id}" aria-pressed="${state.tab===H.id}"><img src="${esc(H.logo)}" alt="">${esc(H.abbr)}</button>
      </div>
      <div class="plist">
        <div class="pr hd"><span>Player</span><span>G</span><span>A</span><span>PTS</span><span>SOG</span><span>1+G</span></div>
        ${rows || `<div class="empty">No recent box scores for this roster yet.</div>`}
      </div>
    </div>`;
}
const winReg = (S, home) => S.reg ? (home ? S.reg.h : S.reg.a) : NaN;

/* ================= settings ================= */
function renderSettings(){
  const seg = (name, opts) => `<div class="seg" data-set="${name}">${opts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${String(settings[name])===String(v)}">${l}</button>`).join("")}</div>`;
  $("#settings").innerHTML = `<div class="settings">
    <label>Simulations per game</label>${seg("sims",[[5000,"5,000"],[10000,"10,000"],[25000,"25,000"]])}
    <label>Games used for team form</label>${seg("win",[[10,"Last 10"],[20,"Last 20"],[0,"Season"]])}
    <label>Blend with Vegas line</label>${seg("vegas",[[0,"Off"],[0.25,"25%"],[0.5,"50%"]])}
  </div>`;
}

/* ================= events ================= */
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="setbtn"){ const s=$("#settings"); s.hidden=!s.hidden; b.setAttribute("aria-expanded", String(!s.hidden)); if(!s.hidden) renderSettings(); return; }
  const seg = b.closest(".seg");
  if(seg){ const k = seg.dataset.set; settings[k] = parseFloat(b.dataset.v); saveSettings(); renderSettings();
    if(k!=="sims") state.results = {};
    if(state.view==="game" && state.game) openGame(state.game, true); else renderHome(); return; }
  if(b.id==="prev"||b.id==="next"){ state.day = shiftDay(state.day, b.id==="next"?1:-1); state.autoAdvanced = true; loadGames(); return; }
  if(b.dataset.day){ state.day = b.dataset.day; state.autoAdvanced = true; loadGames(); return; }
  if(b.id==="simall"){ simAll(); return; }
  if(b.classList.contains("game")){ openGame(state.games[+b.dataset.gi]); return; }
  if(b.classList.contains("back")){ runId++; state.M = null; renderHome(); window.scrollTo(0,0); return; }
  if(b.classList.contains("rerun")){ openGame(state.game, true); return; }
  if(b.dataset.tab){ state.tab = b.dataset.tab; state.open = null; renderGame(); return; }
  if(b.dataset.pid){ state.open = state.open===b.dataset.pid ? null : b.dataset.pid; renderGame(); return; }
});

loadGames();
</script>
</body>
</html>
